[metadata]
license_files = LICENSE

[bdist_wheel]
universal = 0

[flake8]
max-line-length = 120
exclude = 
	.git,
	__pycache__,
	build,
	dist,
	.eggs,
	*.egg-info
ignore = E203, W503

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
	--verbose
	--cov=dataflow_common
	--cov-report=term-missing
	--cov-report=html

[egg_info]
tag_build = 
tag_date = 0

