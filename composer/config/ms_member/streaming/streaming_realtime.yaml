# Configuration for MS Member Mid Term Streaming Pipeline
# Example configuration for streaming mode (mid-term)

# Import defaults
defaults_file: ../common/defaults.yaml

pipeline:
  name: ms_member_mid_term_streaming
  description: MS Member Pipeline - Mid Term Streaming (Real-time)
  schedule: null # Streaming runs continuously
  term_type: mid
  mode: streaming

# GCP Configuration (inherits from defaults, can override)
gcp:
  project_id: the1-insight-dev
  location: asia-southeast1
  environment: dev

# Dataset Configuration (uses defaults)
datasets:
  source_dataset: insight_dev
  staging_dataset: insight_dev
  refined_dataset: insight_dev

# Table Configuration
tables:
  source_project: the1-insight-dev
  # No source_table needed for streaming (reads from Pub/Sub)
  stg_source_table: stg_ms_personas
  stg_origin_table: stg_ms_member
  refined_ongoing_table: ms_personas
  audit_table: audit_job_log
  mapping_table: stg_mapping_reconcile
  error_table: dq_errors

# Streaming Configuration (overrides defaults)
streaming:
  pubsub_topic: projects/the1-insight-dev/topics/member-updates
  window_duration_seconds: 3600 # 1 hour windows
  early_trigger_seconds: 60
  late_trigger_seconds: 300
  allowed_lateness_seconds: 7200
  accumulation_mode: DISCARDING
  mapping_refresh_interval_seconds: 600 # Refresh mapping every 10 minutes
  write_method: STORAGE_WRITE_API
  streaming_mode: at_least_once

# Bigtable Configuration for enrichment
bigtable:
  instance_id: member-cache-instance
  table_id: member-profiles
  app_profile_id: default
  row_key_field: member_number
  columns_to_fetch:
  - member_number
  - profile_data
  - last_activity
  timeout_seconds: 10

# Dataflow Configuration for streaming
dataflow:
  machine_type: n2-standard-4 # Better for streaming
  max_num_workers: 10 # More workers for streaming
  enable_streaming_engine: true
  save_main_session: true
  service_account: t1-ins-dev-sa-data@the1-insight-dev.iam.gserviceaccount.com

# Data Quality Configuration (streaming specific)
data_quality:
  max_errors_percent: 0.01 # Stricter for streaming
  validation_rules:
  - type: required
    field: member_number
  - type: not_null
    field: member_number
  split_output: true # Send errors to DLQ
  write_errors: true

# BigQuery Configuration for streaming
bigquery:
  priority: BATCH # Streaming uses batch priority
  write_disposition: WRITE_APPEND # Always append in streaming
  create_disposition: CREATE_IF_NEEDED
  use_cdc: true # Enable CDC for upserts
  primary_key:
  - member_number

# Monitoring (more important for streaming)
monitoring:
  metrics_enabled: true
  audit_enabled: true
  error_tracking_enabled: true
  alert_on_high_latency: true
  max_latency_seconds: 300

# Job Configuration
job:
  name_template: "ms-member-mid-streaming-{{ ds_nodash }}"
  tags:
  - ms_member
  - mid_term
  - streaming
  - realtime

# Owner and Notification
owner: data-engineering
email_on_failure: true # Important for streaming
email_recipients:
- data-team@the1.co.th
retries: 3
retry_delay_minutes: 1
