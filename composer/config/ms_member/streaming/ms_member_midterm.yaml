# composer/config/ms_member/streaming/ms_member_midterm_complete.yaml

defaults_file: ../common/defaults.yaml

pipeline:
  name: ms_member_midterm_streaming
  mode: streaming
  term: midterm

# Schema definition
schema:
  bq:
    project: "{io.bq.project}"
    dataset: "{io.bq.dataset}"
    table: stg_ms_member

# I/O Configuration
io:
  pubsub:
    subscription: projects/the1-insight-dev/subscriptions/ms-member-updates
    dlq_topic: projects/the1-insight-dev/topics/ms-member-dlq
  bq:
    project: the1-insight-dev
    dataset: insight_dev
    temp_gcs: gs://t1-insight-audit-bucket/temp
  s3:
    refined_prefix: s3://t1-analytics/refined/insights
    region: ap-southeast-1
    num_shards: 10

# Parameters
params:
  pk: member_number
  run_dt: null

# Pipeline Plan
plan:

# Step 1: Consume from Pub/Sub with DLQ
- step: ConsumeMessagesWithDLQ
  id: message_raw
  subscription: "{io.pubsub.subscription}"
  dlq_topic: "{io.pubsub.dlq_topic}"
  max_retries: 3
  with_attributes: true

# Step 2: Parse nested AVRO/JSON
- step: ParseNestedJson
  in: message_raw
  out: message_parsed
  extract_from: payload
  preserve_fields:
  - personaId
  - timestamp
  - status
  json_fields:
  - profiles
  field_mappings:
    memberId: member_number

# Step 3: Query mapping table periodically (every hour)
- step: WindowedMappingQuery
  id: mapping_dict
  window_size: 3600
  query: |
    SELECT RECONCILE_COLUMN_NAME,
           PERSONAS_MAPPING_COLUMN_NAME,
           RECONCILE_RETRIEVED,
           RECONCILE_CONFIRMED,
           UPDATED_DATE
    FROM `{io.bq.project}.{io.bq.dataset}.stg_mapping_reconcile`
    WHERE UPDATED_DATE = (
      SELECT MAX(UPDATED_DATE) 
      FROM `{io.bq.project}.{io.bq.dataset}.stg_mapping_reconcile`
    )
  src_field: PERSONAS_MAPPING_COLUMN_NAME
  dest_field: RECONCILE_COLUMN_NAME
  retrieved_flag_field: RECONCILE_RETRIEVED
  confirmed_flag_field: RECONCILE_CONFIRMED

# Step 4: Map fields using existing MapRecordStep
- step: MapRecord
  in: message_parsed
  side: mapping_dict
  out: message_mapped
  mode: reconcile

# Step 5: Normalize using existing NormalizeToSchema
- step: NormalizeToSchema
  in: message_mapped
  out: normalized

# Step 6: Create hourly partitions for S3
- step: WindowingOpenHourlyPartition
  in: normalized
  out: partitioned
  size: 3600

# Step 7: Write to Parquet with dynamic partitioning
- step: WriteParquetDynamic
  in: partitioned
  batch_size: 1000
  compression: snappy
  file_size_mb: 128

# Step 8: Write to BigQuery
- step: EnhancedWriteToBigQuery
  in: normalized
  table: "{io.bq.project}.{io.bq.dataset}.ms_personas_streaming"
  method: STREAMING_INSERTS
  triggering_frequency: 10
  write_disposition: WRITE_APPEND
  create_disposition: CREATE_IF_NEEDED
  schema: SCHEMA_AUTODETECT
