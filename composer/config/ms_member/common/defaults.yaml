# Default configuration values for MS Member pipelines
# This file contains all default values to avoid hard-coding in the pipeline code

# Default datasets and tables
defaults:
  # GCP defaults
  gcp:
    project_id: the1-insight-dev
    location: asia-southeast1
    environment: dev

  # Dataset defaults
  datasets:
    source_dataset: insight_dev
    staging_dataset: insight_dev
    refined_dataset: insight_dev

  # Table defaults
  tables:
    source_project: the1-insight-dev # Project containing source data
    source_table: personas_test
    stg_source_table: stg_ms_personas # All personas records
    stg_ongoing_source_table: stg_personas # Temporary staging for current batch
    stg_origin_table: stg_ms_member # Member table after reconciliation
    refined_ongoing_table: ms_personas
    audit_table: audit_job_log
    mapping_table: stg_mapping_reconcile # Reconciliation mapping table
    error_table: dq_errors

  # Batch processing settings
  batch:
    min_batch_size: 100
    max_batch_size: 500
    enrichment_batch_size: 500
    batch_limit: 1000 # Default limit for testing (remove or increase for production)
    partition_filter: "DATE(_PARTITIONTIME) = CURRENT_DATE()"
    read_method: EXPORT
    write_method: FILE_LOADS

  # Streaming processing settings
  streaming:
    window_duration_seconds: 3600
    early_trigger_seconds: 60
    late_trigger_seconds: 300
    allowed_lateness_seconds: 7200
    accumulation_mode: DISCARDING
    mapping_refresh_interval_seconds: 600
    enrichment_timeout_seconds: 10
    write_method: STORAGE_WRITE_API
    streaming_mode: at_least_once # or exactly_once

  # Data quality settings
  data_quality:
    max_errors_percent: 0.1
    validation_rules:
    - type: required
      field: member_number
    - type: not_null
      field: member_number
    split_output: false
    write_errors: true

  # BigQuery settings
  bigquery:
    priority: INTERACTIVE
    use_legacy_sql: false
    write_disposition: WRITE_APPEND
    create_disposition: CREATE_IF_NEEDED
    schema_update_options:
    - ALLOW_FIELD_ADDITION
    - ALLOW_FIELD_RELAXATION

  # Bigtable settings (for streaming)
  bigtable:
    instance_id: null # Set in environment-specific config
    table_id: null # Set in environment-specific config
    app_profile_id: default
    timeout_seconds: 10
    row_key_field: member_number
    columns_to_fetch:
    - member_number

  # Pub/Sub settings (for streaming)
  pubsub:
    topic: null # Set in streaming config
    subscription: null # Set in streaming config

  # Monitoring and logging
  monitoring:
    metrics_enabled: true
    audit_enabled: true
    error_tracking_enabled: true
    health_check_interval_seconds: 300

  # Retry and timeout settings
  retry:
    max_retries: 3
    initial_backoff_seconds: 1
    max_backoff_seconds: 60
    backoff_multiplier: 2

  # Dataflow execution settings
  dataflow:
    machine_type: n1-standard-2
    max_num_workers: 5
    disk_size_gb: 100
    save_main_session: false
    setup_file_required: false
    requirements_cache_enabled: true
    worker_cache_mb: 100
    service_account: t1-ins-dev-sa-data@the1-insight-dev.iam.gserviceaccount.com
    execution_timeout_minutes: 30

  # Storage locations
  storage:
    airflow_bucket: gs://t1-airflow-composer-bucket
    dataflow_bucket: gs://t1-dataflow-framework-bucket
    audit_bucket: gs://t1-insight-audit-bucket
    temp_location: gs://t1-insight-audit-bucket/audit_log/dataflow/temp
    staging_location: gs://t1-insight-audit-bucket/audit_log/dataflow/staging

  # Job settings
  job:
    tags:
    - ms_member
    - data_pipeline

  # Ownership and notifications
  owner: data-engineering
  email_on_failure: false
  email_on_retry: false
  email_recipients: []
  retries: 2
  retry_delay_minutes: 5
  depends_on_past: false
