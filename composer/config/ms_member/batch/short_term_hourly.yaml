# Configuration for MS Member Short Term Hourly Batch Pipeline
# Inherits defaults from common/defaults.yaml

# Import defaults
defaults_file: ../common/defaults.yaml

pipeline:
  name: ms_member_short_term_hourly
  description: MS Member Pipeline - Short Term Hourly Batch
  schedule: "@hourly"
  term_type: short
  mode: batch

# GCP Configuration
gcp:
  project_id: the1-insight-dev
  location: asia-southeast1
  environment: dev

# Storage Configuration
storage:
  airflow_bucket: gs://t1-airflow-composer-bucket
  dataflow_bucket: gs://t1-dataflow-framework-bucket
  audit_bucket: gs://t1-insight-audit-bucket
  dataflow_file: gs://t1-dataflow-framework-bucket/framework/unified_dataflow_pipeline_bigtable.py
  temp_location: gs://t1-insight-audit-bucket/audit_log/dataflow/temp
  staging_location: gs://t1-insight-audit-bucket/audit_log/dataflow/staging

# Dataset Configuration
datasets:
  source_dataset: insight_dev # Changed to insight_dev as per your test scripts
  staging_dataset: insight_dev
  refined_dataset: insight_dev

# Table Configuration - Critical for pipeline
tables:
  source_project: the1-insight-dev # Required for cross-project access
  source_table: personas_test # Changed to personas_test as per your test
  stg_source_table: stg_ms_personas # All personas data
  stg_ongoing_source_table: stg_personas # Temporary staging table for current batch
  stg_origin_table: stg_ms_member # Member table after mapping
  refined_ongoing_table: ms_personas
  audit_table: audit_job_log
  mapping_table: stg_mapping_reconcile # Changed from mapping_reconcile
  error_table: dq_errors

# Batch Processing Configuration  
batch:
  min_batch_size: 100
  max_batch_size: 500
  enrichment_batch_size: 500
  batch_limit: 1000 # Limit records for processing (remove in production)
  partition_filter: "DATE(_PARTITIONTIME) = CURRENT_DATE()"
  read_method: DIRECT_READ
  write_method: FILE_LOADS

# Dataflow Configuration
dataflow:
  machine_type: n1-standard-2
  max_num_workers: 5
  execution_timeout_minutes: 30
  save_main_session: true
  service_account: t1-ins-dev-sa-data@the1-insight-dev.iam.gserviceaccount.com # Fixed service account
  python_requirements:
  - google-cloud-secret-manager==2.16.3
  - google-cloud-bigquery==3.25.0
  - google-cloud-bigtable==2.23.0
  # - apache-beam[gcp]==2.59.0 # Match with DAG version
  extra_packages:
  - gs://t1-dataflow-framework-bucket/artifacts/dataflow_common-1.0.0-py3-none-any.whl

# Data Quality Configuration
data_quality:
  max_errors_percent: 0.05
  checks:
  - type: record_count
    warning_threshold: 100 # Lower threshold for testing
  - type: unique_members
    check_field: member_number
  - type: freshness
    max_hours: 2
  validation_rules:
  - type: required
    field: member_number
  - type: not_null
    field: member_number
  split_output: false
  write_errors: true
  error_table: dq_errors

# BigQuery Configuration
bigquery:
  priority: INTERACTIVE
  use_legacy_sql: false
  write_disposition: WRITE_TRUNCATE # TRUNCATE for batch short-term
  create_disposition: CREATE_IF_NEEDED

# Monitoring Configuration
monitoring:
  metrics_enabled: true
  audit_enabled: true
  error_tracking_enabled: true

# Retry Configuration
retry:
  max_retries: 3
  initial_backoff_seconds: 1
  max_backoff_seconds: 60

# Job Configuration
job:
  name_template: "ms-member-short-staging-{{ ds_nodash }}-{{ ts_nodash }}"
  tags:
  - ms_member
  - short_term
  - batch
  - hourly

# Owner and Notification
owner: data-engineering
email_on_failure: false
email_on_retry: false
retries: 2
retry_delay_minutes: 5
depends_on_past: false
