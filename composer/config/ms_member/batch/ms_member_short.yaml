defaults_file: null

pipeline:
  name: ms_member_short
  mode: batch
  term: short

# Schema definition: load from BigQuery table.  Alternatively set
# ``gcs_uri`` to a JSON schema file.  This schema will be converted
# to PyArrow and used for normalisation and Parquet output.  You can
# also set ``schema.bq.query`` to run a dry query for schema.
schema:
  bq:
    project: "{io.bq.project}"
    dataset: "{io.bq.dataset}"
    table: stg_ms_member # adjust to your actual schema source

# Parsing formats for dates and timestamps.  Override these if your
# source data uses different formats.
formats:
  date:
  - "%Y-%m-%d"
  - "%d/%m/%Y"
  timestamp:
  - "%Y-%m-%d %H:%M:%S.%f"
  - "%Y-%m-%d %H:%M:%S"
  - "%Y-%m-%dT%H:%M:%S.%f"
  - "%Y-%m-%dT%H:%M:%S"

# Pipeline parameters.  ``run_dt`` must be provided at runtime by
# overriding this value or setting an environment variable.  The
# ``pk`` key identifies the primary key used for joins.
params:
  pk: member_number
  run_dt: null
  max_date: null

# I/O configuration.  Values can be referenced in the plan via
# placeholders like ``{io.bq.project}``.
io:
  bq:
    project: the1-insight-dev
    dataset: insight_dev
    temp_gcs: gs://t1-insight-audit-bucket/audit_log/dataflow/temp
  s3:
    refined_prefix: s3://t1-analytics/refined/insights

# Plan defining the pipeline steps.  Each step's ``id`` or ``out``
# field becomes a key in the orchestration state.  The order of
# steps matters.  See README for more details.
plan:
# - step: ReadGCS
#   id: max_date
#   out: max_date
#   path: gs://t1-insight-audit-bucket/cache/ms_member_max_date.txt
#   format: text
# - step: SetMaxDateParam # เพิ่ม step นี้
#   in: max_date
#   out: max_date_set

- step: ReadBQQuery
  id: mapping_rows
  out: mapping_rows
  query: |
    SELECT RECONCILE_COLUMN_NAME,
           PERSONAS_MAPPING_COLUMN_NAME,
           RECONCILE_RETRIEVED,
           RECONCILE_CONFIRMED,
           UPDATED_DATE
    FROM `{io.bq.project}.{io.bq.dataset}.stg_mapping_reconcile`
    WHERE COALESCE(UPDATED_DATE, '1999-12-31') = (
        SELECT COALESCE(MAX(UPDATED_DATE), '1999-12-31')
        FROM `{io.bq.project}.{io.bq.dataset}.stg_mapping_reconcile`
    )
- step: BuildMappingDict
  in: mapping_rows
  out: mapping_dict
  mapping_fields:
    src_field: PERSONAS_MAPPING_COLUMN_NAME
    dest_field: RECONCILE_COLUMN_NAME
    retrieved_flag_field: RECONCILE_RETRIEVED
    confirmed_flag_field: RECONCILE_CONFIRMED
- step: ReadBQQuery
  id: source_rows
  out: source_rows_raw
  query: |
    SELECT * EXCEPT(RN_PK)
    FROM (
      SELECT *, ROW_NUMBER() OVER(
        PARTITION BY JSON_VALUE(profiles, '$.memberId')
        ORDER BY TIMESTAMP DESC
      ) AS RN_PK
      FROM `the1-insight-stg.insight.personas`
      WHERE TIMESTAMP >= TIMESTAMP('{params.max_date}')
    ) WHERE RN_PK = 1

# เพิ่ม step parse JSON
- step: ParseProfiles
  in: source_rows_raw
  out: source_rows
  json_fields: [ "profiles" ]

- step: ReadBQQuery
  id: origin_rows
  out: origin_rows
  query: |
    SELECT DISTINCT origin.*
    FROM `{io.bq.project}.{io.bq.dataset}.stg_ms_member` origin
    INNER JOIN (
      SELECT DISTINCT JSON_VALUE(profiles, '$.memberId') as member_id
      FROM `the1-insight-stg.insight.personas`
      WHERE TIMESTAMP >= TIMESTAMP('{params.max_date}')
    ) new_members
    ON origin.MEMBER_NUMBER = new_members.member_id
- step: MapRecord
  in: source_rows
  side: mapping_dict
  out: mapped_new
  mode: reconcile
- step: KVPairs
  in: origin_rows
  out: kv_old
  key_field: "{params.pk}"
- step: KVPairs
  in: mapped_new
  out: kv_new
  key_field: "{params.pk}"
- step: CoGroupByKey
  id: grouped
  out: grouped
  as:
    old: kv_old
    new: kv_new
- step: CoalesceByMapping
  in: grouped
  side: mapping_rows
  out: reconcile_rows
  flag_field: RECONCILE_RETRIEVED
  dest_field: RECONCILE_COLUMN_NAME
- step: GetNewMaxDate
  max_date_step: new
  field: updated_date
  in: reconcile_rows
  out: new_max_date
- step: WriteGCS
  in: new_max_date
  path: gs://t1-insight-audit-bucket/cache/ms_member_max_date.txt
  format: text
# - step: CoalesceByMapping
#   in: grouped
#   side: mapping_rows
#   out: patch_origin_rows
#   flag_field: RECONCILE_CONFIRMED
#   dest_field: RECONCILE_COLUMN_NAME
- step: NormalizeToSchema
  in: reconcile_rows
  out: reconcile_casted
# - step: NormalizeToSchema
#   in: patch_origin_rows
#   out: member_casted
- step: WriteParquet
  in: reconcile_casted
  prefix: "{io.s3.refined_prefix}/ms_personas_dev/par_month={params.run_par_month}/par_day={params.run_par_day}/par_hour={params.run_par_hour}/run_dt={params.run_dt}"

# - step: WriteParquet
#   in: member_casted
#   prefix: "{io.s3.refined_prefix}/ms_member_temp_dev_test/run_dt={params.run_dt}"
